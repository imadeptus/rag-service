name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests (offline, fake providers)
        run: pytest -q
        env:
          PYTHONPATH: src
      - name: Retrieval eval on sample corpus
        run: python eval/run_eval.py --docs sample_docs --golden eval/golden.jsonl --k 5
        env:
          PYTHONPATH: src
