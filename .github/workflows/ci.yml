name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests (offline, fake providers)
        run: pytest -q
        env:
          PYTHONPATH: src
      - name: Run retrieval quality gate
        run: python eval/run_eval.py --k 3 --min-hit 0.85 --min-mrr 0.7
        env:
          PYTHONPATH: src
