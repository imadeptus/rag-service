services:
  app:
    build: .
    ports:
      - "8000:8000"
    # Optional: the stack boots on defaults from .env.example without a .env.
    env_file:
      - path: .env
        required: false
    environment:
      STORE_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
    # The app creates its Qdrant collection at startup, so waiting for the
    # container to exist is not enough — it has to be answering.
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  qdrant-data:
