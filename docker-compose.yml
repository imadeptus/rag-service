services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      STORE_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
