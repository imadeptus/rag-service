[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/rag_service"]

[tool.coverage.report]
# Ratchet, not an aspiration: the offline suite reaches ~88%. The remaining
# gap is QdrantStore, which needs a running Qdrant; the compose stack covers
# it instead. Raise this number by adding tests, never lower it to pass.
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "eval"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["qdrant_client.*"]
ignore_missing_imports = true
